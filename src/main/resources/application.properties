weather.geocoding-url=https://geocoding-api.open-meteo.com
weather.forecast-url=https://api.open-meteo.com

# Outbound HTTP timeouts (applied to every RestClient built from the auto-configured builder)
spring.http.client.connect-timeout=3s
spring.http.client.read-timeout=5s

# Cache lifetimes: city -> coordinates changes rarely; weather is refreshed by the provider every ~15 min
weather.cache.geocode-ttl=24h
weather.cache.weather-ttl=10m
weather.cache.max-entries=1000

# Per-client-IP limit for /api/** (fixed one-minute window)
weather.rate-limit.requests-per-minute=60

# RFC 9457 error bodies (application/problem+json) for all MVC errors
spring.mvc.problemdetails.enabled=true

# Operations
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
